buildscript {
    repositories {
        // 保持原有仓库，不添加 GTNH 到 buildscript
        maven {
            name = "central"
            url = "https://maven.thorfusion.com/artifactory/central/"
        }
        // 添加 Forge Maven 作为备用
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
        mavenCentral()
    }
    dependencies {
        classpath('com.anatawa12.forge:ForgeGradle:1.2-1.1.+') {
            changing = true
        }
        classpath "org.jfrog.buildinfo:build-info-extractor-gradle:4.33.1"
        // 移除 foojay 插件依赖
    }
}

plugins {
    id 'java-library'
    // 移除 foojay 插件
}

apply plugin: 'forge'
apply plugin: 'idea'
apply plugin: 'java'
apply plugin: "com.jfrog.artifactory"
apply plugin: "maven-publish"

defaultTasks 'fullBuild'

repositories {
    maven {
        name 'central'
        url 'https://maven.thorfusion.com/artifactory/central/'
    }
    // 主项目可以添加 GTNH 仓库（可选）
    maven {
        name 'GTNH Maven'
        url = "https://maven.gtnewhorizons.com/repository/public/"
        // 如果连接失败，可以注释掉这行
        // content { includeGroup 'com.github.GTNewHorizons' }
    }
    mavenCentral()
}

idea {
    module {
        inheritOutputDirs = true
    }
}

// ============ 关键：Java 8 兼容性配置 ============
sourceCompatibility = '1.8'
targetCompatibility = '1.8'

// 确保编译选项正确
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // 不使用 release 选项（ForgeGradle 1.2 可能不兼容）
    options.source = '1.8'
    options.target = '1.8'
}

dependencies {
    // ============ 新增：ASM 9 支持 Java 17+ ============
    // 这些会在运行时使用，不影响编译
    implementation 'org.ow2.asm:asm:9.7'
    implementation 'org.ow2.asm:asm-tree:9.7'
    implementation 'org.ow2.asm:asm-commons:9.7'
    implementation 'org.ow2.asm:asm-util:9.7'
    
    // 原有依赖
    implementation "codechicken:CodeChickenLib:${minecraft_version}-${CCLIB_version}:dev"
    implementation "codechicken:ForgeMultipart:${minecraft_version}-${FMP_version}:dev"
    implementation "codechicken:NotEnoughItems:${minecraft_version}-${NEI_version}:dev"
    implementation "codechicken:CodeChickenCore:${minecraft_version}-${CCC_version}:dev"
    implementation "inventorytweaks:inventory-tweaks:1.7.10-1.60.0:api"
    implementation "net.industrial-craft:industrialcraft-2:2.2.828-experimental:api"
    implementation "mcp.mobius.waila:Waila:1.5.10_1.7.10:dev"
}

if (System.getenv("BUILD_VER") == null) {
    mod_version = mod_version
} else {
    mod_version = mod_version + "-" + System.getenv("BUILD_VER")
}
version = minecraft_version + "-" + mod_version
group = "mekanism"
archivesBaseName = "Mekanism-Community-Edition"
libsDirName = "../output"
distsDirName = "../output"

minecraft {
    version = minecraft_version + "-" + forge_version
    replaceIn "mekanism/common/Mekanism.java"
    replaceIn "mekanism/generators/common/MekanismGenerators.java"
    replaceIn "mekanism/tools/common/MekanismTools.java"
    replaceIn "mekanism/defense/common/DefenseTech.java"
    replaceIn "mekanism/ultimate/common/MekanismUltimate.java"
    replace "GRADLE_MODVERSION", mod_version
    replace "GRADLE_VERSIONMOD", alt_version
}

processResources {
    duplicatesStrategy = 'include'
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
        exclude '**/*.blend*'
    }
}

// ============ 所有 JAR 任务添加 Java 17 兼容性声明 ============
task coreJar(type: Jar) {
    classifier = 'Core'
    manifest {
        attributes 'FMLCorePlugin': 'mekanism.common.asm.LoadingHook'
        attributes 'FMLCorePluginContainsFMLMod': 'true'
        attributes 'ForceLoadAsMod': 'true'
        attributes 'TweakClass': 'mekanism.common.asm.LoadingHook'
        attributes 'TweakOrder': '0'
    }

    from('etc/core') {
        include '*.info'
        expand 'version': mod_version, 'mc_version': minecraft_version, 'fmp_version': FMP_version
    }

    from zipTree(jar.outputs.getFiles().getSingleFile()).matching {
        exclude 'mekanism/tools/**', 'mekanism/generators/**', 'mekanism/defense/**', 'defense/**', 'mcmod.info', 'mekanism/ultimate/**'
    }
}

task alltJar(type: Jar) {
    classifier = 'ALL'
    manifest {
        attributes 'FMLCorePlugin': 'mekanism.common.asm.LoadingHook'
        attributes 'FMLCorePluginContainsFMLMod': 'true'
        attributes 'ForceLoadAsMod': 'true'
        attributes 'TweakClass': 'mekanism.common.asm.LoadingHook'
        attributes 'TweakOrder': '0'
    }
    from('etc/all') {
        include '*.info'
        expand 'version': mod_version, 'mc_version': minecraft_version, 'fmp_version': FMP_version
    }
    from zipTree(jar.outputs.getFiles().getSingleFile()).matching {
        exclude 'mcmod.info', 'mekanism/defense/**', 'defense/**', 'mekanism/ultimate/**'
    }
}

task toolsJar(type: Jar) {
    classifier = 'Tools'
    from('etc/tools') {
        include '*.info'
        expand 'version': mod_version, 'mc_version': minecraft_version, 'fmp_version': FMP_version
    }

    from zipTree(jar.outputs.getFiles().getSingleFile()).matching {
        include 'mekanism/tools/**'
        exclude 'mcmod.info'
    }
}

task generatorsJar(type: Jar) {
    classifier = 'Generators'
    from('etc/generators') {
        include '*.info'
        expand 'version': mod_version, 'mc_version': minecraft_version, 'fmp_version': FMP_version
    }

    from zipTree(jar.outputs.getFiles().getSingleFile()).matching {
        include 'mekanism/generators/**'
        exclude 'mcmod.info'
    }
}

task defensetechJar(type: Jar) {
    classifier = 'DefenseTech'
    from('etc/defense') {
        include '*.info'
        expand 'version': mod_version, 'mc_version': minecraft_version, 'fmp_version': FMP_version
    }

    from zipTree(jar.outputs.getFiles().getSingleFile()).matching {
        include 'mekanism/defense/**', 'defense/**'
        exclude 'mcmod.info'
    }
}

task ultimateJar(type: Jar) {
    classifier = 'Ultimate'
    from('etc/ultimate') {
        include '*.info'
        expand 'version': mod_version, 'mc_version': minecraft_version, 'fmp_version': FMP_version
    }

    from zipTree(jar.outputs.getFiles().getSingleFile()).matching {
        include 'mekanism/ultimate/**'
        exclude 'mcmod.info'
    }
}

task devJar(type: Jar) {
    classifier = 'DEV'
    dependsOn processResources
    from sourceSets.main.java.srcDirs
    manifest {
        attributes 'FMLCorePlugin': 'mekanism.common.asm.LoadingHook'
        attributes 'FMLCorePluginContainsFMLMod': 'true'
        attributes 'ForceLoadAsMod': 'true'
        attributes 'TweakClass': 'mekanism.common.asm.LoadingHook'
        attributes 'TweakOrder': '0'
    }
    from('etc/all') {
        include '*.info'
        expand 'version': mod_version, 'mc_version': minecraft_version, 'fmp_version': FMP_version
    }
    from zipTree(jar.outputs.getFiles().getSingleFile()).matching {
        exclude 'mcmod.info'
    }
}

task apiJar(type: Jar) {
    classifier = 'API'
    dependsOn processResources
    from sourceSets.main.java.srcDirs
    from sourceSets.main.output
    include 'mekanism/api/**', 'defense/api/**'
}

coreJar.dependsOn('reobf')
toolsJar.dependsOn('reobf')
generatorsJar.dependsOn('reobf')
alltJar.dependsOn('reobf')
defensetechJar.dependsOn('reobf')
ultimateJar.dependsOn('reobf')

task MDKZip(type: Zip) {
    classifier = 'MDK'
    from sourceSets.main.java.srcDirs
    include 'mekanism/api/**'
}

task fullBuild(type: Delete) {
    delete jar
}

fullBuild.dependsOn('toolsJar', 'coreJar', 'generatorsJar', 'MDKZip', 'alltJar', 'apiJar', 'devJar','defensetechJar', 'ultimateJar')

artifactory {
    contextUrl = System.getenv("MAVEN_URL")
    publish {
        repository {
            repoKey = System.getenv("MAVEN_REPO")
            username = System.getenv("MAVEN_USERNAME")
            password = System.getenv("MAVEN_PASSWORD")
            maven = true
        }
        defaults {
            publications('mavenJava')
        }
        publishBuildInfo = false
        publishArtifacts = true
        publishPom = true
    }
    resolve {
        repository {
            repoKey = System.getenv("MAVEN_REPO")
            username = System.getenv("MAVEN_USERNAME")
            password = System.getenv("MAVEN_PASSWORD")
            maven = true
        }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = project.archivesBaseName
            groupId = project.group
            version = project.version
            artifacts = [toolsJar, coreJar, generatorsJar, MDKZip, alltJar, apiJar, devJar, defensetechJar, ultimateJar]
            components.java.withVariantsFromConfiguration(configurations.runtimeElements) {
                skip()
            }
            pom {
                name.set("Mekanism Community Edition")
                description.set('Mekanism is a Minecraft add-on featuring high-tech machinery that can be used to create powerful tools, armor, and weapons.')
                url.set('https://github.com/Thorfusion/Mekanism-Community-Edition')
                issueManagement {
                    system.set('github')
                    url.set('https://github.com/Thorfusion/Mekanism-Community-Edition/issues')
                }
                licenses {
                    license {
                        name.set('EUPL-1.2')
                        distribution.set('repo')
                    }
                }
            }
        }
    }
}
